<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:prints="http://xmlns.jcp.org/jsf/composite/ezcomp/prints"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
    <h:body>
        <ui:composition template="/resources/template/template.xhtml">
            <ui:define name="content">
                <h:form>
                    <h:panelGroup rendered="#{patientEncounterController.generatedPreBill ne null}">
                        <h:panelGrid columns="3" class="my-2">
                            <p:commandButton 
                                value="Back to OPD Visit"
                                icon="fas fa-arrow-left"
                                class="ui-button-secondary"
                                ajax="false" 
                                action="#{patientEncounterController.navigateToOpdVisit()}" >
                            </p:commandButton>

                            <p:commandButton 
                                value="New Bill Token" 
                                class="ui-button-success m-1"
                                icon="fa fa-plus"
                                action="#{patientEncounterController.navigateToOpdVisit()}"
                                ajax="false">
                            </p:commandButton>

                            <p:commandButton 
                                icon="fas fa-print" 
                                class="ui-button-info mx-2" 
                                ajax="false" 
                                value="Print">
                                <p:printer target="billToken"></p:printer>
                            </p:commandButton>
                        </h:panelGrid>

                        <h:panelGroup id="billToken">
                            <prints:lab_bill_token 
                                preBill="#{patientEncounterController.generatedPreBill}"
                                billToken="#{patientEncounterController.generatedBillToken}"/>
                        </h:panelGroup>
                    </h:panelGroup>
                    
                    <h:panelGroup rendered="#{patientEncounterController.generatedPreBill eq null}">
                        <div class="alert alert-warning text-center p-5">
                            <i class="fas fa-exclamation-triangle fa-3x mb-3"></i>
                            <h3>No Bill Token Found</h3>
                            <p>Please go back to OPD Visit and generate a bill token.</p>
                            <p:commandButton 
                                value="Go to OPD Visit"
                                icon="fas fa-arrow-left"
                                class="ui-button-primary"
                                ajax="false" 
                                action="#{patientEncounterController.navigateToOpdVisit()}">
                            </p:commandButton>
                        </div>
                    </h:panelGroup>
                </h:form>
            </ui:define>
        </ui:composition>
    </h:body>
</html>
