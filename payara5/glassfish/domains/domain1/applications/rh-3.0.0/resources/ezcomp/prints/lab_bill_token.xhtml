<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:cc="http://xmlns.jcp.org/jsf/composite"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:p="http://primefaces.org/ui">

    <!-- INTERFACE -->
    <cc:interface>
        <cc:attribute name="preBill" type="com.divudi.core.entity.PreBill"  />
        <cc:attribute name="billToken" type="java.lang.String"  />
    </cc:interface>

    <!-- IMPLEMENTATION -->
    <cc:implementation>

        <h:outputStylesheet library="css" name="pharmacytoken.css" ></h:outputStylesheet>
        <div class="posbill" style="text-align: center;">

            <div class="headingBill">
                <h:outputLabel value="#{cc.attrs.preBill.institution.name}" style="font-size: 16px; font-weight: 900"/>
            </div>
            <div class="headingBill">
                <h:outputLabel value="LAB TEST BILL TOKEN" style="font-size: 13px; font-weight: 900"/>
            </div>

            <div class="billline">
                <h:outputLabel value="-----------------------------------------------"   />
            </div>

            <!-- Bill Token Number (Large) -->
            <div class="billline" style="margin-top: -10px;">
                <h1 style="font-size: 48px; margin: 10px 0;">
                    #{cc.attrs.billToken}
                </h1>
            </div>

            <div class="billline" style="margin-top: -20px;">
                <h:outputLabel value="-----------------------------------------------"   />
            </div>

            <!-- Bill Number -->
            <div style="margin-top: -10px;font-size: 14pt;font-weight: bold">
                Bill No: #{cc.attrs.preBill.insId}
            </div>
            
            <!-- Barcode -->
            <div class="billline d-flex justify-content-center my-1">
                <p:barcode value="#{cc.attrs.preBill.id.toString()}"
                           width="400"
                           height="100"
                           type="code128"  >
                </p:barcode>
            </div>

            <div class="billline">
                <h:outputLabel value="-----------------------------------------------"   />
            </div>

            <!-- Bill Details -->
            <div class="billDetails" >
                <table style="margin-left: 15%; width: 70%;">
                    <tr>
                        <td style="width: 30%; text-align: left;" >
                            <h:outputLabel value="Date" class="billDetails" ></h:outputLabel>
                        </td>
                        <td style="width: 10%; text-align: center;">:</td>
                        <td style="width: 60%; text-align: left;" >
                            <h:outputLabel value="#{cc.attrs.preBill.billDate}" class="billDetails" >
                                <f:convertDateTime pattern="dd-MMM-yyyy" ></f:convertDateTime>
                            </h:outputLabel>
                            <p:spacer width="10"/>
                            <h:outputLabel value="#{cc.attrs.preBill.billTime}" class="billDetails">
                                <f:convertDateTime  timeZone="Asia/Colombo" pattern="hh:mm a"  ></f:convertDateTime>
                            </h:outputLabel>
                        </td>
                    </tr>

                    <h:panelGroup rendered="#{cc.attrs.preBill.patient ne null}" >
                        <tr>
                            <td style="width: 30% ;text-align: left;" >
                                <h:outputLabel value="Patient" ></h:outputLabel>
                            </td>
                            <td style="width: 10%; text-align: center;">:</td>
                            <td style="width: 60%; text-align: left;" >
                                <h:outputLabel value="#{cc.attrs.preBill.patient.person.nameWithTitle}"  >
                                </h:outputLabel>
                            </td>
                        </tr>
                        <tr>
                            <td style="width: 30% ;text-align: left;" >
                                <h:outputLabel value="Patient No" ></h:outputLabel>
                            </td>
                            <td style="width: 10%; text-align: center;">:</td>
                            <td style="width: 60%; text-align: left;" >
                                <h:outputLabel value="#{cc.attrs.preBill.patient.code}"  >
                                </h:outputLabel>
                            </td>
                        </tr>
                        <tr>
                            <td style="width: 30% ;text-align: left;" >
                                <h:outputLabel value="Phone" ></h:outputLabel>
                            </td>
                            <td style="width: 10%; text-align: center;">:</td>
                            <td style="width: 60%; text-align: left;" >
                                <h:outputLabel value="#{cc.attrs.preBill.patient.person.mobile}"  >
                                </h:outputLabel>
                            </td>
                        </tr>
                    </h:panelGroup>
                    
                    <tr>
                        <td style="width: 30% ;text-align: left;" >
                            <h:outputLabel value="Department" ></h:outputLabel>
                        </td>
                        <td style="width: 10%; text-align: center;">:</td>
                        <td style="width: 60%; text-align: left;" >
                            <h:outputLabel value="#{cc.attrs.preBill.department.name}"  >
                            </h:outputLabel>
                        </td>
                    </tr>
                </table>
            </div>
            
            <div class="billline">
                <h:outputLabel value="-----------------------------------------------"   />
            </div>
            
            <!-- Tests Ordered -->
            <div class="billDetails" style="margin-top: 10px;">
                <h:outputLabel value="TESTS ORDERED" style="font-size: 12px; font-weight: bold;"/>
            </div>
            
            <div class="billDetails" style="margin-top: 5px;">
                <table style="width: 90%; margin-left: 5%;">
                    <ui:repeat value="#{cc.attrs.preBill.billItems}" var="item">
                        <tr>
                            <td style="text-align: left; font-size: 10px;">
                                #{item.item.name}
                            </td>
                            <td style="text-align: right; font-size: 10px;">
                                <h:outputText value="#{item.netValue}" rendered="#{item.netValue gt 0}">
                                    <f:convertNumber type="currency" currencySymbol="UGX " />
                                </h:outputText>
                                <h:outputText value="TBD" rendered="#{item.netValue eq 0}" style="color: red;"/>
                            </td>
                        </tr>
                    </ui:repeat>
                </table>
            </div>
            
            <div class="billline">
                <h:outputLabel value="-----------------------------------------------"   />
            </div>
            
            <!-- Total -->
            <div class="billDetails" style="margin-top: 5px;">
                <table style="width: 90%; margin-left: 5%;">
                    <tr>
                        <td style="text-align: left; font-size: 12px; font-weight: bold;">
                            TOTAL
                        </td>
                        <td style="text-align: right; font-size: 12px; font-weight: bold;">
                            <h:outputText value="#{cc.attrs.preBill.total}">
                                <f:convertNumber type="currency" currencySymbol="UGX " />
                            </h:outputText>
                        </td>
                    </tr>
                </table>
            </div>
            
            <div class="billline">
                <h:outputLabel value="-----------------------------------------------"   />
            </div>

            <!-- Instructions -->
            <div class="billDetails" style="margin-top: 10px; font-size: 10px;">
                <h:outputLabel value="INSTRUCTIONS:" style="font-weight: bold;"/>
                <br/>
                <h:outputLabel value="1. Go to CASHIER with this token"/>
                <br/>
                <h:outputLabel value="2. Make payment"/>
                <br/>
                <h:outputLabel value="3. Proceed to LAB"/>
            </div>
            
            <div class="billline">
                <h:outputLabel value="-----------------------------------------------"   />
            </div>
            
            <div class="billDetails" style="margin-top: 10px; font-size: 9px;">
                <h:outputLabel value="#{cc.attrs.preBill.comments}"   />
            </div>

        </div>
    </cc:implementation>
</html>
