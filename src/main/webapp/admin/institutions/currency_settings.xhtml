<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:p="http://primefaces.org/ui"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

    <h:body>
        <ui:composition template="/admin/institutions/admin_institutions_index.xhtml">
            <ui:define name="admin">
                <h:form>
                    <p:panel header="Currency Settings">
                        <h:panelGrid columns="2" cellpadding="5">
                            <h:outputLabel value="System Default Currency:" for="currency"/>
                            <p:selectOneMenu id="currency" 
                                             value="#{configOptionApplicationController.systemCurrency}"
                                             style="width:250px;">
                                <f:selectItems value="#{enumController.currencyList}" 
                                               var="curr" 
                                               itemValue="#{curr}" 
                                               itemLabel="#{curr.label}"/>
                            </p:selectOneMenu>

                            <h:outputLabel value="Enable Multi-Currency:" for="multiCurrency"/>
                            <p:selectBooleanCheckbox id="multiCurrency" 
                                                     value="#{configOptionApplicationController.multiCurrencyEnabled}"/>

                            <h:outputLabel value="Show Currency Symbol in Bills:" for="symbolInBills"/>
                            <p:selectBooleanCheckbox id="symbolInBills" 
                                                     value="#{configOptionApplicationController.showCurrencySymbolInBills}"/>

                            <h:outputLabel value="Show Currency Code in Reports:" for="codeInReports"/>
                            <p:selectBooleanCheckbox id="codeInReports" 
                                                     value="#{configOptionApplicationController.showCurrencyCodeInReports}"/>
                        </h:panelGrid>

                        <p:commandButton value="Save Settings" 
                                         action="#{configOptionApplicationController.saveCurrencySettings()}"
                                         update="@form"
                                         icon="pi pi-save"
                                         styleClass="ui-button-success"/>
                    </p:panel>

                    <br/>

                    <p:panel header="Current Currency Information">
                        <h:panelGrid columns="2" cellpadding="5">
                            <h:outputLabel value="Currency Code:"/>
                            <h:outputText value="#{configOptionApplicationController.currencyCode}"/>

                            <h:outputLabel value="Currency Symbol:"/>
                            <h:outputText value="#{configOptionApplicationController.currencySymbol}"/>

                            <h:outputLabel value="Currency Name:"/>
                            <h:outputText value="#{configOptionApplicationController.systemCurrency.displayName}"/>
                        </h:panelGrid>
                    </p:panel>
                </h:form>
            </ui:define>
        </ui:composition>
    </h:body>
</html>
