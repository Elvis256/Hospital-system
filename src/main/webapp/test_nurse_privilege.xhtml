<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui">
<h:head>
    <title>Privilege Test</title>
</h:head>
<h:body>
    <h:form>
        <h1>Privilege Test Page</h1>
        
        <p:panel header="Testing NurseTriageStation Privilege">
            <h:panelGrid columns="2">
                <h:outputText value="Logged User:" />
                <h:outputText value="#{sessionController.loggedUser.name}" />
                
                <h:outputText value="Has NurseTriageStation:" />
                <h:outputText value="#{webUserController.hasPrivilege('NurseTriageStation')}" 
                              style="font-weight: bold; color: #{webUserController.hasPrivilege('NurseTriageStation') ? 'green' : 'red'}"/>
                
                <h:outputText value="Has Admin:" />
                <h:outputText value="#{webUserController.hasPrivilege('Admin')}" 
                              style="font-weight: bold; color: #{webUserController.hasPrivilege('Admin') ? 'green' : 'red'}"/>
                              
                <h:outputText value="Has OpdBilling:" />
                <h:outputText value="#{webUserController.hasPrivilege('OpdBilling')}" 
                              style="font-weight: bold; color: #{webUserController.hasPrivilege('OpdBilling') ? 'green' : 'red'}"/>
            </h:panelGrid>
            
            <p:separator />
            
            <h3>Icon Display Test:</h3>
            
            <h:panelGroup rendered="#{webUserController.hasPrivilege('NurseTriageStation')}">
                <p style="color: green; font-weight: bold;">
                    ✓ Nurse Triage Station icon SHOULD BE VISIBLE on home page!
                </p>
                <p:graphicImage library="images" name="home/nurse-station.svg" width="80" height="80"/>
            </h:panelGroup>
            
            <h:panelGroup rendered="#{!webUserController.hasPrivilege('NurseTriageStation')}">
                <p style="color: red; font-weight: bold;">
                    ✗ You do NOT have NurseTriageStation privilege!
                </p>
            </h:panelGroup>
            
            <p:separator />
            
            <p:commandButton value="Go to Nurse Station" 
                           action="/nurse/nurse_station?faces-redirect=true"
                           icon="pi pi-arrow-right"/>
            
            <p:commandButton value="Back to Home" 
                           action="/home?faces-redirect=true"
                           icon="pi pi-home"/>
        </p:panel>
    </h:form>
</h:body>
</html>
