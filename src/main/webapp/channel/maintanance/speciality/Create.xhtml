<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition>

        <p:dialog id="SpecialityCreateDlg" widgetVar="SpecialityCreateDialog" modal="true" resizable="false" appendTo="@(body)" header="Create Medical Speciality" width="600">
            <h:form id="SpecialityCreateForm">
                <h:panelGroup id="display">
                    <p:panelGrid columns="2" rendered="#{specialityController.selected != null}" styleClass="ui-panelgrid-blank" style="width: 100%">
                        
                        <p:outputLabel value="Name *" for="name" />
                        <p:inputText id="name" value="#{specialityController.selected.name}" 
                                     required="true" requiredMessage="Speciality Name is required"
                                     style="width: 100%"/>
                        
                        <p:outputLabel value="Code" for="code" />
                        <p:inputText id="code" value="#{specialityController.selected.code}" 
                                     style="width: 100%"/>
                        
                        <p:outputLabel value="Description" for="description" />
                        <p:inputTextarea id="description" value="#{specialityController.selected.description}" 
                                         rows="3" style="width: 100%"/>
                        
                        <p:outputLabel value="Order No" for="orderNo" />
                        <p:inputNumber id="orderNo" value="#{specialityController.selected.orderNo}" 
                                       decimalPlaces="0" style="width: 100%"/>
                        
                    </p:panelGrid>
                    <p:separator/>
                    <div class="p-2">
                        <p:commandButton actionListener="#{specialityController.create}" 
                                        value="Save" 
                                        icon="pi pi-save"
                                        styleClass="ui-button-success"
                                        update="display,:SpecialityListForm:datalist,:growl" 
                                        oncomplete="handleSubmit(args,'SpecialityCreateDialog');"/>
                        <p:commandButton value="Cancel" 
                                        icon="pi pi-times"
                                        styleClass="ui-button-secondary"
                                        onclick="SpecialityCreateDialog.hide()" 
                                        type="button"/>
                    </div>
                </h:panelGroup>
            </h:form>
        </p:dialog>

    </ui:composition>
</html>
