<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:cc="http://xmlns.jcp.org/jsf/composite"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:p="http://primefaces.org/ui">

    <!-- INTERFACE -->
    <cc:interface>
        <cc:attribute name="bill" type="com.divudi.core.entity.Bill"  />
    </cc:interface>

    <!-- IMPLEMENTATION -->
    <cc:implementation>

        <h:outputStylesheet library="css" name="pharmacytoken.css" ></h:outputStylesheet>
        <div class="posbill" style="text-align: center;">

            <div class="headingBill">
                <h:outputLabel value="#{sessionController.institution.name}" style="font-size: 16px; font-weight: 900"/>
            </div>
            <div class="headingBill">
                <h:outputLabel value="Lab Order Payment Receipt" style="font-size: 13px; font-weight: 900"/>
            </div>

            <div class="billline">
                <h:outputLabel value="-----------------------------------------------"   />
            </div>

            <div class="billline" style="margin-top: -10px;">
                <h3>
                    Bill No: #{cc.attrs.bill.deptId}
                </h3>
            </div>

            <div class="billline" style="margin-top: -10px;">
                <h:outputLabel value="-----------------------------------------------"   />
            </div>

            <div class="billline d-flex justify-content-center my-2">
                <p:barcode value="#{cc.attrs.bill.idStr}"
                           width="400"
                           height="100"
                           type="code128"  >
                </p:barcode>
            </div>

            <div class="billline">
                <h:outputLabel value="-----------------------------------------------"   />
            </div>

            <div class="billDetails" >
                <table style="margin-left:  10%; width: 80%;">
                    <tr>
                        <td style="width: 30%; text-align: left;" >
                            <h:outputLabel value="Date" class="billDetails" ></h:outputLabel>
                        </td>
                        <td style="width: 10%; text-align: center;">:</td>
                        <td style="width: 60%; text-align: left;" >
                            <h:outputLabel value="#{cc.attrs.bill.billDate}" class="billDetails" >
                                <f:convertDateTime pattern="#{sessionController.applicationPreference.shortDateFormat}" ></f:convertDateTime>
                            </h:outputLabel>
                            <p:spacer width="10"/>
                            <h:outputLabel value="#{cc.attrs.bill.billTime}" class="billDetails">
                                <f:convertDateTime  timeZone="Asia/Colombo" pattern="#{sessionController.applicationPreference.shortTimeFormat}"  ></f:convertDateTime>
                            </h:outputLabel>
                        </td>
                    </tr>

                    <h:panelGroup rendered="#{cc.attrs.bill.patient ne null}" >
                        <tr>
                            <td style="width: 30% ;text-align: left;" >
                                <h:outputLabel value="Patient" ></h:outputLabel>
                            </td>
                            <td style="width: 10%; text-align: center;">:</td>
                            <td style="width: 60%; text-align: left;" >
                                <h:outputLabel value="#{cc.attrs.bill.patient.person.nameWithTitle}"  >
                                </h:outputLabel>
                            </td>
                        </tr>
                        <tr>
                            <td style="width: 30% ;text-align: left;" >
                                <h:outputLabel value="PHN" ></h:outputLabel>
                            </td>
                            <td style="width: 10%; text-align: center;">:</td>
                            <td style="width: 60%; text-align: left;" >
                                <h:outputLabel value="#{cc.attrs.bill.patient.phn}"  >
                                </h:outputLabel>
                            </td>
                        </tr>
                    </h:panelGroup>

                    <tr>
                        <td style="width: 30% ;text-align: left;" >
                            <h:outputLabel value="Net Total" class="billDetails" style="font-weight: bold;"></h:outputLabel>
                        </td>
                        <td style="width: 10%; text-align: center;">:</td>
                        <td style="width: 60%; text-align: left;" >
                            <h:outputLabel value="#{cc.attrs.bill.netTotal}" class="billDetails" style="font-weight: bold;">
                                <f:convertNumber pattern="#,##0.00" />
                            </h:outputLabel>
                        </td>
                    </tr>
                </table>
            </div>
            
            <div class="billline">
                <h:outputLabel value="-----------------------------------------------"   />
            </div>

            <div class="billDetails" style="font-size: 10pt; margin-top: 10px;">
                <h:outputLabel value="Please present this receipt at cashier for payment" />
            </div>

            <div class="billline" style="margin-top: 10px;">
                <h:outputLabel value="-----------------------------------------------"   />
            </div>

        </div>
    </cc:implementation>
</html>
